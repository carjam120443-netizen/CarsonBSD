name: Build CarsonBSD ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBSD_VERSION: "7.9"
  OPENBSD_ARCH: "amd64"
  OPENBSD_ISO: "install79.iso"
  OPENBSD_PKG_URL: "https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/amd64/"

defaults:
  run:
    shell: bash

jobs:
  build-iso:
    name: Build bootable CarsonBSD development ISO
    runs-on: ubuntu-latest

    steps:
      - name: Check out CarsonBSD
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y xorriso

      - name: Download OpenBSD installer base
        run: |
          set -eux
          mkdir -p downloads dist staging
          curl -fL --retry 3 \
            "https://cdn.openbsd.org/pub/OpenBSD/${OPENBSD_VERSION}/${OPENBSD_ARCH}/${OPENBSD_ISO}" \
            -o "downloads/${OPENBSD_ISO}"

      - name: Stage CarsonBSD base, cbpkg, desktop shortcut, and installer
        run: |
          set -eux
          rm -rf staging
          mkdir -p \
            staging/etc \
            staging/usr/local/sbin \
            staging/usr/local/bin \
            staging/usr/local/share/carsonbsd \
            staging/usr/local/share/applications \
            staging/artwork/logo

          cp -a base/etc/. staging/etc/
          cp -a base/usr/. staging/usr/
          cp -a artwork/logo/carsonbsd.svg staging/artwork/logo/
          cp README.md staging/README.md

          cat > staging/usr/local/sbin/cbpkg <<'EOF'
          #!/bin/sh
          # CarsonBSD package frontend. Initially delegates to OpenBSD pkg_add.
          set -eu

          PKG_PATH="${PKG_PATH:-https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/amd64/}"
          export PKG_PATH

          usage() {
            echo "Usage: cbpkg {add|install|delete|remove|update|info|search} ..."
            echo ""
            echo "CarsonBSD package manager frontend"
            echo "Backend: OpenBSD pkg_add/pkg_delete/pkg_info/pkg_add -u"
          }

          [ "$#" -gt 0 ] || { usage; exit 1; }

          case "$1" in
            add|install)
              shift
              exec pkg_add "$@"
              ;;
            delete|remove)
              shift
              exec pkg_delete "$@"
              ;;
            update)
              shift
              exec pkg_add -u "$@"
              ;;
            info)
              shift
              exec pkg_info "$@"
              ;;
            search)
              shift
              exec pkg_info -Q "$@"
              ;;
            *)
              usage
              exit 2
              ;;
          esac
          EOF
          chmod +x staging/usr/local/sbin/cbpkg

          cat > staging/usr/local/bin/carsonbsd-installer <<'EOF'
          #!/bin/sh
          # CarsonBSD graphical installer launcher.
          # Calamares is intentionally optional until an OpenBSD-compatible
          # Calamares build is available; the OpenBSD installer remains the
          # supported installation path for this development ISO.
          if command -v calamares >/dev/null 2>&1; then
            exec calamares "$@"
          fi
          echo "CarsonBSD Installer"
          echo ""
          echo "Calamares is not currently provided by the OpenBSD 7.9 package repository."
          echo "Use the OpenBSD installer to install this development snapshot."
          exit 0
          EOF
          chmod +x staging/usr/local/bin/carsonbsd-installer

          cat > staging/usr/local/share/applications/carsonbsd-installer.desktop <<'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=CarsonBSD Installer
          Comment=Install CarsonBSD
          Exec=carsonbsd-installer
          Icon=carsonbsd
          Terminal=true
          Categories=System;Settings;
          EOF

          cat > staging/usr/local/share/carsonbsd/install-desktop.sh <<'EOF'
          #!/bin/sh
          # Install CarsonBSD's initial desktop targets on a running OpenBSD system.
          set -eu

          if [ "$(id -u)" -ne 0 ]; then
            echo "install-desktop.sh must be run as root." >&2
            exit 1
          fi

          export PKG_PATH="${PKG_PATH:-https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/amd64/}"
          echo "Installing XFCE and cwm from the OpenBSD 7.9 package repository..."
          pkg_add xfce cwm
          echo "Desktop packages installed."
          EOF
          chmod +x staging/usr/local/share/carsonbsd/install-desktop.sh

          cat > staging/ISO-INFO.txt <<'EOF'
          CarsonBSD 0.1-dev

          Bootable development ISO based on the OpenBSD 7.9 amd64 installer media.

          Included CarsonBSD components:
            - XFCE desktop installation target
            - cwm minimal window-manager target
            - cbpkg package-manager frontend
            - CarsonBSD Installer desktop launcher
            - CarsonBSD logo and base metadata

          Calamares:
            A launcher/configuration point is included, but Calamares is not
            falsely bundled as an OpenBSD package because it is not currently
            available in the official OpenBSD 7.9 amd64 package repository.

          This remains a development ISO, not yet a standalone CarsonBSD installer.
          EOF

      - name: Create bootable development ISO
        run: |
          set -eux
          xorriso \
            -indev "downloads/${OPENBSD_ISO}" \
            -outdev dist/carsonbsd-0.1-dev.iso \
            -boot_image any replay \
            -volid CARSONBSD_DEV \
            -map staging/ /CARSONBSD/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsonbsd-0.1-dev-bootable-iso
          path: dist/carsonbsd-0.1-dev.iso
          if-no-files-found: error