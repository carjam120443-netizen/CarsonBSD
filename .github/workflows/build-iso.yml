name: Build CarsonBSD ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBSD_VERSION: "7.9"
  OPENBSD_ARCH: "amd64"
  OPENBSD_ISO: "install79.iso"
  OPENBSD_PKG_URL: "https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/amd64/"

defaults:
  run:
    shell: bash

jobs:
  build-iso:
    name: Build bootable CarsonBSD development ISO
    runs-on: ubuntu-latest

    steps:
      - name: Check out CarsonBSD
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential curl xz-utils
          curl -fL --retry 3 \
            "https://ftp.gnu.org/gnu/xorriso/xorriso-1.5.8.pl02.tar.gz" \
            -o /tmp/xorriso.tar.gz
          tar -xzf /tmp/xorriso.tar.gz -C /tmp
          cd /tmp/xorriso-1.5.8
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          hash -r
          /usr/local/bin/xorriso -version

      - name: Download OpenBSD installer base
        run: |
          set -eux
          mkdir -p downloads dist staging
          curl -fL --retry 3 \
            "https://cdn.openbsd.org/pub/OpenBSD/${OPENBSD_VERSION}/${OPENBSD_ARCH}/${OPENBSD_ISO}" \
            -o "downloads/${OPENBSD_ISO}"

      - name: Stage CarsonBSD base, installer, and desktop branding
        run: |
          set -eux
          rm -rf staging
          mkdir -p staging/etc staging/etc/skel/Desktop staging/usr/local/sbin staging/usr/local/bin staging/usr/local/share/carsonbsd staging/usr/local/share/applications staging/usr/local/share/backgrounds/carsonbsd staging/usr/local/share/icons/hicolor/scalable/apps staging/artwork/logo staging/artwork/wallpaper
          cp -a base/etc/. staging/etc/
          cp -a base/usr/. staging/usr/
          cp -a artwork/logo/carsonbsd.svg staging/artwork/logo/
          cp -a artwork/wallpaper/carsonbsd-installer.svg staging/artwork/wallpaper/
          cp README.md staging/README.md
          cp artwork/wallpaper/carsonbsd-installer.svg staging/usr/local/share/backgrounds/carsonbsd/carsonbsd-default.svg
          curl -fL --retry 3 "https://upload.wikimedia.org/wikipedia/commons/c/ce/Computer_icon_cc0.svg" -o staging/usr/local/share/icons/hicolor/scalable/apps/carsonbsd-installer.svg
          cat > staging/usr/local/share/carsonbsd/ICON-LICENSE.txt <<'EOF'
          CarsonBSD Installer icon
          Source: Wikimedia Commons - Computer icon cc0.svg
          Author: Markus Suhr
          License: CC0 1.0 Universal Public Domain Dedication
          Source page: https://commons.wikimedia.org/wiki/File:Computer_icon_cc0.svg
          EOF
          install -m 755 tools/cbpkg staging/usr/local/bin/cbpkg
          ln -sf /usr/local/bin/cbpkg staging/usr/local/sbin/cbpkg
          cat > staging/usr/local/bin/carsonbsd-installer <<'EOF'
          #!/bin/sh
          set -eu
          echo "CarsonBSD Installer"
          echo "===================="
          echo ""
          echo "1) Automatic installation"
          echo "2) Custom disk installation"
          echo "3) OpenBSD installer / advanced mode"
          echo "4) Reboot"
          echo ""
          printf "Select [1-4]: "
          read choice
          case "$choice" in
            1) exec /usr/local/share/carsonbsd/autoinstall-carsonbsd ;;
            2) exec /usr/local/share/carsonbsd/custom-install ;;
            3) exec /bsd.rd ;;
            4) reboot ;;
            *) echo "Invalid selection."; exit 2 ;;
          esac
          EOF
          chmod +x staging/usr/local/bin/carsonbsd-installer
          cat > staging/usr/local/share/carsonbsd/autoinstall-carsonbsd <<'EOF'
          #!/bin/sh
          set -eu
          echo "CarsonBSD automatic installation"
          echo ""
          echo "This mode is intended for a dedicated installation disk."
          echo "It uses the CarsonBSD autoinstall profile with OpenBSD installer tooling."
          echo ""
          echo "Automatic disk setup will erase the selected target disk."
          echo ""
          exec /bsd.rd
          EOF
          chmod +x staging/usr/local/share/carsonbsd/autoinstall-carsonbsd
          cat > staging/usr/local/share/carsonbsd/custom-install <<'EOF'
          #!/bin/sh
          set -eu
          echo "CarsonBSD custom installation"
          echo ""
          echo "Use the OpenBSD installer to select the target disk and configure GPT, partitions, filesystems, swap, and mount points."
          echo ""
          exec /bsd.rd
          EOF
          chmod +x staging/usr/local/share/carsonbsd/custom-install
          cat > staging/usr/local/share/applications/carsonbsd-installer.desktop <<'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=CarsonBSD Installer
          Comment=Install CarsonBSD
          Exec=carsonbsd-installer
          Icon=carsonbsd-installer
          Terminal=true
          Categories=System;Settings;
          EOF
          cp staging/usr/local/share/applications/carsonbsd-installer.desktop staging/etc/skel/Desktop/carsonbsd-installer.desktop
          chmod 644 staging/etc/skel/Desktop/carsonbsd-installer.desktop
          cat > staging/usr/local/share/carsonbsd/install-desktop.sh <<'EOF'
          #!/bin/sh
          set -eu
          if [ "$(id -u)" -ne 0 ]; then echo "install-desktop.sh must be run as root." >&2; exit 1; fi
          export PKG_PATH="${PKG_PATH:-https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/amd64/}"
          pkg_add xfce cwm
          install -d /usr/local/share/backgrounds/carsonbsd /usr/local/share/icons/hicolor/scalable/apps /usr/local/share/applications /etc/skel/Desktop
          install -m 644 /CARSONBSD/usr/local/share/backgrounds/carsonbsd/carsonbsd-default.svg /usr/local/share/backgrounds/carsonbsd/carsonbsd-default.svg
          install -m 644 /CARSONBSD/usr/local/share/icons/hicolor/scalable/apps/carsonbsd-installer.svg /usr/local/share/icons/hicolor/scalable/apps/carsonbsd-installer.svg
          install -m 644 /CARSONBSD/usr/local/share/applications/carsonbsd-installer.desktop /usr/local/share/applications/carsonbsd-installer.desktop
          install -m 644 /CARSONBSD/etc/skel/Desktop/carsonbsd-installer.desktop /etc/skel/Desktop/carsonbsd-installer.desktop
          install -m 755 /CARSONBSD/usr/local/bin/cbpkg /usr/local/bin/cbpkg
          ln -sf /usr/local/bin/cbpkg /usr/local/sbin/cbpkg
          echo "Desktop packages, CarsonBSD installer launcher, and cbpkg installed."
          EOF
          chmod +x staging/usr/local/share/carsonbsd/install-desktop.sh
          cat > staging/usr/local/share/carsonbsd/set-xfce-default-background.sh <<'EOF'
          #!/bin/sh
          set -eu
          WALLPAPER="/usr/local/share/backgrounds/carsonbsd/carsonbsd-default.svg"
          command -v xfconf-query >/dev/null 2>&1 || exit 0
          [ -f "$WALLPAPER" ] || exit 0
          xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/image-path -s "$WALLPAPER" || true
          xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/image-style -s 5 || true
          EOF
          chmod +x staging/usr/local/share/carsonbsd/set-xfce-default-background.sh
          cat > staging/ISO-INFO.txt <<'EOF'
          CarsonBSD 0.1-dev
          Bootable development ISO based on OpenBSD 7.9 amd64 installer media.
          CarsonBSD package manager: cbpkg, sourced from tools/cbpkg.
          EOF

      - name: Create bootable development ISO
        run: |
          set -eux
          rm -f dist/carsonbsd-0.1-dev.iso
          /usr/local/bin/xorriso \
            -indev "downloads/${OPENBSD_ISO}" \
            -outdev dist/carsonbsd-0.1-dev.iso \
            -volid CARSONBSD_DEV \
            -map staging/ /CARSONBSD/ \
            -boot_image any keep

      - name: Verify ISO boot structure
        run: |
          set -eux
          REPORT="$(mktemp)"
          /usr/local/bin/xorriso \
            -indev dist/carsonbsd-0.1-dev.iso \
            -report_el_torito plain 2>&1 | tee "$REPORT"
          grep -q 'El Torito catalog' "$REPORT"
          grep -Eq 'El Torito boot img :[[:space:]]+1[[:space:]]+BIOS' "$REPORT"
          grep -Eq 'El Torito boot img :[[:space:]]+2[[:space:]]+UEFI' "$REPORT"
          grep -Eq 'El Torito img path :[[:space:]]+1[[:space:]]+/7\.9/amd64/cdbr' "$REPORT"
          grep -Eq 'El Torito img path :[[:space:]]+2[[:space:]]+/7\.9/amd64/eficdboot' "$REPORT"
          /usr/local/bin/xorriso \
            -indev dist/carsonbsd-0.1-dev.iso \
            -ls /7.9/amd64
          /usr/local/bin/xorriso \
            -indev dist/carsonbsd-0.1-dev.iso \
            -ls /CARSONBSD
          rm -f "$REPORT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsonbsd-0.1-dev-bootable-iso
          path: dist/carsonbsd-0.1-dev.iso
          if-no-files-found: error
