name: Build CarsonBSD ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build development ISO
    runs-on: ubuntu-latest

    steps:
      - name: Check out CarsonBSD
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y xorriso

      - name: Stage CarsonBSD filesystem
        run: |
          set -eux
          rm -rf staging
          mkdir -p staging/etc staging/usr/local/sbin staging/artwork/logo
          cp -a base/etc/. staging/etc/
          cp -a base/usr/. staging/usr/
          cp -a artwork/logo/carsonbsd.svg staging/artwork/logo/
          cp README.md staging/README.md
          cat > staging/ISO-INFO.txt <<'EOF'
          CarsonBSD 0.1-dev

          Development ISO artifact generated by GitHub Actions.
          OpenBSD-based project; bootable OS integration is still in development.
          EOF

      - name: Build ISO
        run: |
          set -eux
          mkdir -p dist
          xorriso -as mkisofs \
            -V CARSONBSD_DEV \
            -J -R \
            -o dist/carsonbsd-0.1-dev.iso \
            staging/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsonbsd-0.1-dev-iso
          path: dist/carsonbsd-0.1-dev.iso
          if-no-files-found: error
