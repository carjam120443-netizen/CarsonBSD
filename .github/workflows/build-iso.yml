name: Build CarsonBSD ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBSD_VERSION: "7.9"
  OPENBSD_ARCH: "amd64"
  OPENBSD_ISO: "install79.iso"

jobs:
  build-iso:
    name: Build bootable CarsonBSD development ISO
    runs-on: ubuntu-latest

    steps:
      - name: Check out CarsonBSD
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y xorriso

      - name: Download OpenBSD installer base
        run: |
          set -eux
          mkdir -p downloads dist staging
          curl -fL --retry 3 \
            "https://cdn.openbsd.org/pub/OpenBSD/${OPENBSD_VERSION}/${OPENBSD_ARCH}/${OPENBSD_ISO}" \
            -o "downloads/${OPENBSD_ISO}"

      - name: Stage CarsonBSD files
        run: |
          set -eux
          rm -rf staging
          mkdir -p staging/etc staging/usr/local/sbin staging/artwork/logo
          cp -a base/etc/. staging/etc/
          cp -a base/usr/. staging/usr/
          cp -a artwork/logo/carsonbsd.svg staging/artwork/logo/
          cp README.md staging/README.md
          cat > staging/ISO-INFO.txt <<'EOF'
          CarsonBSD 0.1-dev

          Bootable development ISO based on the OpenBSD 7.9 amd64 installer media.
          CarsonBSD project files are included as a development payload.

          This is not yet a standalone CarsonBSD operating-system installer.
          The next stage is integrating the CarsonBSD base system into the
          OpenBSD build and installation process.
          EOF

      - name: Create bootable development ISO
        run: |
          set -eux
          xorriso \
            -indev "downloads/${OPENBSD_ISO}" \
            -outdev dist/carsonbsd-0.1-dev.iso \
            -boot_image any replay \
            -volid CARSONBSD_DEV \
            -map staging/ /CARSONBSD/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsonbsd-0.1-dev-bootable-iso
          path: dist/carsonbsd-0.1-dev.iso
          if-no-files-found: error
