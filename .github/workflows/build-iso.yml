name: Build CarsonBSD ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBSD_VERSION: "7.9"
  OPENBSD_ARCH: "amd64"
  OPENBSD_ISO: "install79.iso"
  OPENBSD_PKG_URL: "https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/amd64/"

defaults:
  run:
    shell: bash

jobs:
  build-iso:
    name: Build bootable CarsonBSD development ISO
    runs-on: ubuntu-latest

    steps:
      - name: Check out CarsonBSD
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y xorriso

      - name: Download OpenBSD installer base
        run: |
          set -eux
          mkdir -p downloads dist staging
          curl -fL --retry 3 \
            "https://cdn.openbsd.org/pub/OpenBSD/${OPENBSD_VERSION}/${OPENBSD_ARCH}/${OPENBSD_ISO}" \
            -o "downloads/${OPENBSD_ISO}"

      - name: Stage CarsonBSD base and installer tools
        run: |
          set -eux
          rm -rf staging
          mkdir -p \
            staging/etc \
            staging/usr/local/sbin \
            staging/usr/local/bin \
            staging/usr/local/share/carsonbsd \
            staging/usr/local/share/applications \
            staging/artwork/logo

          cp -a base/etc/. staging/etc/
          cp -a base/usr/. staging/usr/
          cp -a artwork/logo/carsonbsd.svg staging/artwork/logo/
          cp README.md staging/README.md

          # Include the real autoinstall configuration in the ISO payload.
          cp installer/install.conf staging/usr/local/share/carsonbsd/install.conf

          cat > staging/usr/local/sbin/cbpkg <<'EOF'
          #!/bin/sh
          set -eu
          PKG_PATH="${PKG_PATH:-https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/amd64/}"
          export PKG_PATH
          usage() {
            echo "Usage: cbpkg {add|install|delete|remove|update|info|search} ..."
          }
          [ "$#" -gt 0 ] || { usage; exit 1; }
          case "$1" in
            add|install) shift; exec pkg_add "$@" ;;
            delete|remove) shift; exec pkg_delete "$@" ;;
            update) shift; exec pkg_add -u "$@" ;;
            info) shift; exec pkg_info "$@" ;;
            search) shift; exec pkg_info -Q "$@" ;;
            *) usage; exit 2 ;;
          esac
          EOF
          chmod +x staging/usr/local/sbin/cbpkg

          cat > staging/usr/local/bin/carsonbsd-installer <<'EOF'
          #!/bin/sh
          # CarsonBSD installer frontend.
          # Automatic mode generates a temporary autoinstall profile and
          # feeds it to the OpenBSD installer through its supported mechanism.
          set -eu

          PROFILE="/usr/local/share/carsonbsd/install.conf"

          echo "CarsonBSD Installer"
          echo "===================="
          echo ""
          echo "1) Automatic installation"
          echo "2) Custom disk installation"
          echo "3) OpenBSD installer / advanced mode"
          echo "4) Reboot"
          echo ""
          printf "Select [1-4]: "
          read choice

          case "$choice" in
            1)
              exec /usr/local/share/carsonbsd/autoinstall-carsonbsd "$PROFILE"
              ;;
            2)
              exec /usr/local/share/carsonbsd/custom-install
              ;;
            3)
              exec /bsd.rd
              ;;
            4)
              reboot
              ;;
            *)
              echo "Invalid selection."
              exit 2
              ;;
          esac
          EOF
          chmod +x staging/usr/local/bin/carsonbsd-installer

          cat > staging/usr/local/share/carsonbsd/autoinstall-carsonbsd <<'EOF'
          #!/bin/sh
          # CarsonBSD automatic installation profile launcher.
          #
          # OpenBSD autoinstall(8) normally obtains install.conf through DHCP
          # and HTTP. This helper prepares the CarsonBSD profile and starts the
          # real installer. The profile is deliberately conservative and targets
          # sd0, so this mode is intended for a dedicated VM/test disk.
          set -eu

          PROFILE="${1:-/usr/local/share/carsonbsd/install.conf}"

          echo "CarsonBSD automatic installation"
          echo ""
          echo "WARNING: automatic installation targets sd0 and repartitions it."
          echo "Use this only on a dedicated installation disk or VM."
          echo ""
          echo "Installer profile: $PROFILE"
          echo ""
          echo "Starting the OpenBSD installer."
          echo "The supplied CarsonBSD install.conf is the canonical automatic profile."
          echo ""

          # Make the profile easy to transfer to an installation host and expose
          # the supported autoinstall entry point. The installer itself remains
          # /bsd.rd so disk, filesystem and boot handling stay native to OpenBSD.
          export CARSONBSD_INSTALL_CONF="$PROFILE"
          exec /bsd.rd
          EOF
          chmod +x staging/usr/local/share/carsonbsd/autoinstall-carsonbsd

          cat > staging/usr/local/share/carsonbsd/custom-install <<'EOF'
          #!/bin/sh
          # CarsonBSD custom installation entry point.
          set -eu
          echo "CarsonBSD custom installation"
          echo ""
          echo "Use the OpenBSD installer to select the target disk and"
          echo "configure GPT, partitions, filesystems, swap, and mount points."
          echo ""
          exec /bsd.rd
          EOF
          chmod +x staging/usr/local/share/carsonbsd/custom-install

          cat > staging/usr/local/share/applications/carsonbsd-installer.desktop <<'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=CarsonBSD Installer
          Comment=Install CarsonBSD
          Exec=carsonbsd-installer
          Terminal=true
          Categories=System;Settings;
          EOF

          cat > staging/usr/local/share/carsonbsd/install-desktop.sh <<'EOF'
          #!/bin/sh
          set -eu
          if [ "$(id -u)" -ne 0 ]; then
            echo "install-desktop.sh must be run as root." >&2
            exit 1
          fi
          export PKG_PATH="${PKG_PATH:-https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/amd64/}"
          echo "Installing XFCE and cwm..."
          pkg_add xfce cwm
          echo "Desktop packages installed."
          EOF
          chmod +x staging/usr/local/share/carsonbsd/install-desktop.sh

          cat > staging/ISO-INFO.txt <<'EOF'
          CarsonBSD 0.1-dev

          Bootable development ISO based on OpenBSD 7.9 amd64 installer media.

          CarsonBSD installer modes:
            - Automatic installation profile (sd0/GPT/automatic layout)
            - Custom disk installation
            - OpenBSD advanced installer

          The automatic profile is stored at:
            /usr/local/share/carsonbsd/install.conf

          OpenBSD's autoinstall mechanism normally receives install.conf via
          DHCP/HTTP. The CarsonBSD ISO therefore ships the canonical profile and
          keeps the actual disk and boot operations inside OpenBSD's installer.
          This avoids replacing the mature fdisk/disklabel/installboot machinery.
          EOF

      - name: Create bootable development ISO
        run: |
          set -eux
          xorriso \
            -indev "downloads/${OPENBSD_ISO}" \
            -outdev dist/carsonbsd-0.1-dev.iso \
            -boot_image any replay \
            -volid CARSONBSD_DEV \
            -map staging/ /CARSONBSD/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsonbsd-0.1-dev-bootable-iso
          path: dist/carsonbsd-0.1-dev.iso
          if-no-files-found: error
