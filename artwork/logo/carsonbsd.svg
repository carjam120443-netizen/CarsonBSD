<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">CarsonBSD logo</title>
  <desc id="desc">An original stylized horned BSD-inspired mascot with the CarsonBSD wordmark.</desc>
  <rect width="640" height="320" fill="none"/>

  <!-- Original CarsonBSD mascot mark -->
  <g transform="translate(34 28)">
    <!-- horns -->
    <path d="M99 94 C68 76 58 43 68 18 C91 31 110 52 118 82 Z" fill="#f2c94c" stroke="#111" stroke-width="8" stroke-linejoin="round"/>
    <path d="M411 94 C442 76 452 43 442 18 C419 31 400 52 392 82 Z" fill="#f2c94c" stroke="#111" stroke-width="8" stroke-linejoin="round"/>

    <!-- head -->
    <path d="M82 91 C82 50 127 27 255 27 C383 27 428 50 428 91 L428 178 C428 229 371 264 255 264 C139 264 82 229 82 178 Z" fill="#111"/>

    <!-- face -->
    <path d="M119 115 C145 84 188 74 255 74 C322 74 365 84 391 115 L378 191 C354 220 309 236 255 236 C201 236 156 220 132 191 Z" fill="#fff"/>

    <!-- eyes -->
    <circle cx="190" cy="145" r="15" fill="#111"/>
    <circle cx="320" cy="145" r="15" fill="#111"/>
    <circle cx="186" cy="141" r="4" fill="#f2c94c"/>
    <circle cx="316" cy="141" r="4" fill="#f2c94c"/>

    <!-- nose and smile -->
    <path d="M237 164 Q255 151 273 164 L255 180 Z" fill="#111"/>
    <path d="M205 190 Q255 224 305 190" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>

    <!-- lower badge -->
    <path d="M214 211 Q255 225 296 211 L286 239 Q255 249 224 239 Z" fill="#f2c94c"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="292" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="1">CarsonBSD</text>
</svg>
